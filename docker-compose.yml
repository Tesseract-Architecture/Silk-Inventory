services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # La app no necesita ningún privilegio del kernel (escucha en el 8080).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Sin Caddy: descomentar para entrar directo por http://<server>:8080
    # ports:
    #   - "8080:8080"

  # HTTPS delante de la app (necesario para el login de Microsoft fuera de localhost).
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
