# /etc/nginx/snippets/inventario-proxy.conf — cómo llega cada pedido a la VM del inventario.
# __INVENTARIO_IP__ lo reemplaza install-inventario.sh con la IP de la VM.
# En la VM atiende el Caddy del docker-compose.yml en el 443, con certificado propio (tls internal).
proxy_pass https://__INVENTARIO_IP__:443;
proxy_ssl_verify off;                  # certificado propio de Caddy, dentro de la red de la oficina
proxy_ssl_server_name on;              # Caddy elige el certificado por SNI: sin esto corta el handshake
proxy_ssl_name inventario.silk-technologies.com;
proxy_http_version 1.1;
proxy_set_header Host $host;           # Caddy atiende solo el nombre de SITE_ADDRESS
proxy_set_header X-Forwarded-For $remote_addr;   # se pisa: nunca pasar lo que mandó el cliente
proxy_set_header X-Forwarded-Proto https;
